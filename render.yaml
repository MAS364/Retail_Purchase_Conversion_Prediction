services:
  # ==========================================================
  # FastAPI Backend
  # ==========================================================
  - type: web
    name: retail-api
    runtime: docker

    repo: https://github.com/MAS364/Retail_Purchase_Conversion_Prediction.git
    branch: main

    dockerfilePath: ./Dockerfile

    plan: free
    autoDeploy: true

    healthCheckPath: /health

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

  # ==========================================================
  # Streamlit Frontend
  # ==========================================================
  - type: web
    name: retail-ui
    runtime: docker

    repo: https://github.com/MAS364/Retail_Purchase_Conversion_Prediction.git
    branch: main

    dockerfilePath: ./Dockerfile.ui

    plan: free
    autoDeploy: true

    envVars:
      - key: API_URL
        fromService:
          type: web
          name: retail-api
          property: host

      - key: PYTHONUNBUFFERED
        value: "1"